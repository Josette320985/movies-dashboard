server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Log de acceso que Fail2Ban va a monitorear
    access_log /var/log/nginx/access.log combined;

    # SPA: redirigir todas las rutas al index.html
    # Esto permite que Vue Router funcione con /login, /dashboard, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bloquear acceso a archivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}