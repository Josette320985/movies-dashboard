[Definition]
# Nginx combined log format:
# <IP> - - [date] "METHOD path HTTP/1.1" status bytes "referer" "user-agent"
#
# Detecta cualquier request HTTP con código de estado de 3 dígitos
failregex = ^<HOST> -.*"(?:GET|POST|HEAD|PUT|DELETE|PATCH|OPTIONS|CONNECT|TRACE) [^"]*" [0-9]{3}

ignoreregex =